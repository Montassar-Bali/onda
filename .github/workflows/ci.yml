name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tropical
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: tropical_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U tropical" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Random throwaway keys for this CI run only (generated by scripts/ensure-test-env.mjs).
      TEST_DATABASE_URL: postgresql://tropical:ci-only-password@localhost:5433/tropical_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test
      - name: Dependency audit (fails on critical runtime vulnerabilities)
        run: npm run audit
      - name: Production build
        run: npx next build
        env:
          SESSION_SECRET: ci-build-only-secret-not-used-anywhere-000000
          DATABASE_URL: postgresql://tropical:ci-only-password@localhost:5433/tropical_test
